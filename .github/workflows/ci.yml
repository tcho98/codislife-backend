name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer le fichier .env pour la CI
        run: |
          echo "POSTGRES_DB=codislife" >> .env
          echo "POSTGRES_USER=codislife" >> .env
          echo "POSTGRES_PASSWORD=ci_test_password" >> .env

      - name: Build et lancement des conteneurs
        run: docker compose up --build -d

      - name: Lancer les tests
        run: docker compose exec -T web python manage.py test

  publish:
      runs-on: ubuntu-latest
      needs: test
      if: startsWith(github.ref, 'refs/tags/v')

      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Connexion au GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extraire le tag de version
          id: meta
          run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

        - name: Build et push de l'image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
              ghcr.io/${{ github.repository }}:latest